name: Node.js CI

on:
  push:
    branches: [ "main", "staging", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build --if-present

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SFTP (Dev)
        if: github.ref == 'refs/heads/dev'
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_URL }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: './build'
          remoteDir: './wwwres/arce/production'
          reverse: true
      - name: Deploy via SFTP (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_URL }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: './build'
          remoteDir: './wwwres/arce/staging'
          reverse: true
      - name: Deploy via SFTP (Main)
        if: github.ref == 'refs/heads/main'
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_URL }}
          port: ${{ secrets.SFTP_PORT }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          localDir: './build'
          remoteDir: './wwwres/arce/dev'
          reverse: true




